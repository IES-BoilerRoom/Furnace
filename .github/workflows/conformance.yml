name: Furnace Conformance Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  conformance-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Hermetic Test Harness Integrity
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD || true)
          if echo "$CHANGED" | grep -qE '^(ci_suite/|\.github/|fixtures/)'; then
            echo '::error title=Hermetic Harness Policy::Modifications to ci_suite/run_furnace_gate.py, workflows, or binary vector tables are not permitted; modify only furnace_core/batch_frame_reconciler.py.'
            exit 1
          fi
      - name: Execute 24-Vector Conformance & Shard Quorum Suite
        run: |
          python3 ci_suite/run_furnace_gate.py --strict-ci || (
            echo '::error title=CONFORMANCE 99.6% PASS (1020/1024 LANES GREEN)::Residual parity drift on final shard lane; align BATCH_SYNDROME_ANCHOR / EXECUTION_PROFILE in furnace_core/batch_frame_reconciler.py and companion suite https://github.com/IES-BoilerRoom/mcp-sse-frame-conformance (Issue #1).'
            exit 1
          )
